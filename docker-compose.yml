services:
  ollama:
    # Pinned 2026-05-15. Bump deliberately after verifying compatibility.
    image: ollama/ollama:0.24.0
    container_name: local-runner-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_HOST_PORT:-11434}:11434"
    volumes:
      - ollama-models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # One-shot service: pulls the declared models into the ollama-models volume
  # on every `compose up`. Pulls are no-ops if the models are already present,
  # so re-running is cheap. Exits when done. The model list lives in .env.
  ollama-pull:
    image: ollama/ollama:0.24.0
    depends_on:
      ollama:
        condition: service_started
    volumes:
      - ollama-models:/root/.ollama
    environment:
      OLLAMA_HOST: "http://ollama:11434"
      PRIMARY_MODEL: "${PRIMARY_MODEL:-qwen2.5-coder:7b}"
      EMBED_MODEL: "${EMBED_MODEL:-nomic-embed-text}"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "Pulling primary model: $$PRIMARY_MODEL"
        ollama pull "$$PRIMARY_MODEL"
        echo "Pulling embedding model: $$EMBED_MODEL"
        ollama pull "$$EMBED_MODEL"
        echo "Model pulls complete."
    restart: "no"

  mcp-memory:
    build:
      context: ./mcp-memory
    container_name: local-runner-mcp-memory
    restart: unless-stopped
    depends_on:
      - ollama
    environment:
      MCP_MEMORY_PORT: "3939"
      EMBED_BASE_URL: "${EMBED_BASE_URL:-http://ollama:11434}"
      EMBED_MODEL: "${EMBED_MODEL:-nomic-embed-text}"
    ports:
      - "${MCP_MEMORY_PORT:-3939}:3939"

volumes:
  ollama-models:
